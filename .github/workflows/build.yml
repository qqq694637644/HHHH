name: build

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }}
      - name: Build
        run: cmake --build build --config ${{ matrix.config }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HHHH-${{ matrix.arch }}-${{ matrix.config }}
          path: |
            build/${{ matrix.config }}/Client.exe
            build/${{ matrix.config }}/Server.exe
          if-no-files-found: error
